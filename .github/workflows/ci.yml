name: CI

# Required tests, reusable by releases so the exact tagged commit is verified.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  privacy:
    name: privacy and leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: privacy-check (home paths, keys, emails, private files)
        run: node dev/privacy-check.mjs
      - name: leak-scan of every tracked file
        run: |
          git ls-files > "$RUNNER_TEMP/list.txt"
          node dev/leak-scan.mjs . --public "$RUNNER_TEMP/list.txt" --env /dev/null

  powershell-fixtures:
    name: PowerShell fixtures (5.1 and pwsh)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Windows PowerShell 5.1 fixtures
        shell: powershell
        run: ./dev/ci/vmtest/run-tests.ps1 -ExpectedVersionPrefix '5.1.'
      - name: PowerShell 7 fixtures
        shell: pwsh
        run: ./dev/ci/vmtest/run-tests.ps1 -ExpectedVersionPrefix '7.'

  tests:
    name: tests (${{ matrix.os }}, Node ${{ matrix.node }}, Python ${{ matrix.python }})
    needs: privacy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22.13.0', '22.x', '24.x']
        python: ['3.11', '3.12', '3.13', '3.14', '3.15-dev']
        include:
          - os: macos-latest
            node: '22.13.0'
            python: '3.11'
          - os: macos-latest
            node: '24.x'
            python: '3.15-dev'
          - os: windows-latest
            node: '22.13.0'
            python: '3.11'
          - os: windows-latest
            node: '24.x'
            python: '3.15-dev'
    runs-on: ${{ matrix.os }}
    # a hung test (a child or listener that never closes) fails the job in 30 min instead of the 6 h default;
    # npm test also gives every test a 3 min timeout
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: python version
        run: python --version
      - name: syntax check
        run: |
          for f in app/*.mjs dev/*.mjs harness/*.mjs harness/bin/*.mjs tools/*.mjs; do [ -e "$f" ] || continue; node --check "$f" || exit; done
          for f in harness/bin/*.sh tools/*.sh; do [ -e "$f" ] || continue; bash -n "$f" || exit; done
      - name: unit tests
        if: runner.os != 'Linux'
        run: npm test
      # Run Linux once, with the stricter warning policy, rather than repeating the whole suite.
      # Removed or changed Python APIs surface here first, before a macOS-only run finds them.
      - name: unit tests (Python deprecations are errors, Linux only)
        if: runner.os == 'Linux'
        run: PYTHONWARNINGS=error::DeprecationWarning npm test

  browser:
    needs: privacy
    uses: ./.github/workflows/browser.yml

  # The published copy as a user gets it: a fresh clone in another folder, a stamped release version (not "dev"),
  # an isolated HOME and TMPDIR, on macOS and Windows where path and process differences show up.
  published-copy:
    name: published copy (${{ matrix.os }})
    needs: privacy
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: clone into a fresh folder and stamp a release version
        run: |
          git clone --quiet --no-hardlinks "$GITHUB_WORKSPACE" "$RUNNER_TEMP/published"
          cd "$RUNNER_TEMP/published"
          if grep -q '"dev"' app/version.json 2>/dev/null; then node dev/stamp-version.mjs v0.0.0 .; fi
      - name: unit tests in the published copy (isolated HOME and TMPDIR)
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/tmp"
          cd "$RUNNER_TEMP/published"
          HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home" TMPDIR="$RUNNER_TEMP/tmp" TEMP="$RUNNER_TEMP/tmp" TMP="$RUNNER_TEMP/tmp" CI=true npm test

  # Compile and bundle all desktop platforms before a tag is pushed. No release uploads.
  desktop-build:
    name: desktop build (${{ matrix.os }})
    needs: privacy
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: macos-latest
            bundles: dmg
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/target
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build and smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils xvfb x11-utils dbus-x11
      # Shared with the main-branch warmer. Tags restore but never create tag-scoped caches.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-release-v1-${{ runner.os }}-${{ runner.arch }}
          workspaces: desktop -> target
          cache-bin: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install and verify prebuilt Tauri CLI
        run: npx --yes --package @tauri-apps/cli@2.12.4 tauri --version
      - name: Build installers without uploading
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop
          tauriScript: npx --yes --package @tauri-apps/cli@2.12.4 tauri
          args: --bundles ${{ matrix.bundles }} -- --locked
          uploadWorkflowArtifacts: false
      - name: Linux native-window and server-lifecycle smoke
        if: runner.os == 'Linux'
        run: dbus-run-session -- node desktop/smoke-test.mjs
      - name: Smoke diagnostics on failure
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ci-desktop-smoke-${{ matrix.os }}
          path: desktop/target/smoke-*/
          if-no-files-found: ignore
          retention-days: 7
