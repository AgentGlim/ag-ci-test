<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alerts</title>
<style>
:root{color-scheme:dark;--bg:#0b0c0e;--panel:#14161a;--line:#262a31;--ink:#e6e8eb;--ink2:#b4bac3;--ink3:#7f8794;--warn:#f0c674;--crit:#e2554f;--ok:#2fd69c;--acc:#5fb8ff;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;z-index:2}
h1{font-size:15px;margin:0;font-weight:600}a{color:var(--acc)}.meta{color:var(--ink3);font-size:12px}
main{padding:12px 16px;max-width:1300px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-width:110px}.tile b{display:block;font-size:20px}.tile span{color:var(--ink3);font-size:11.5px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:10px}.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink3);font:inherit;font-weight:600;padding:6px 10px;cursor:pointer}.tab.on{color:var(--ink);border-bottom-color:var(--acc)}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{background:var(--panel);border:1px solid var(--line);color:var(--ink2);border-radius:99px;padding:2px 10px;font:inherit;font-size:12px;cursor:pointer}.chip.on{border-color:var(--acc);color:var(--ink)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--ink3);font-weight:600;font-size:11.5px}
tr.r{cursor:pointer}tr.r:hover{background:var(--panel)}
.v{font-weight:700;font-size:10.5px;border-radius:4px;padding:0 5px;white-space:nowrap;border:1px solid var(--line);color:var(--ink2)}
.v.crit{background:var(--crit);color:#0b0c0e;border-color:var(--crit)}.v.warn{background:var(--warn);color:#0b0c0e;border-color:var(--warn)}.v.ok{background:var(--ok);color:#0b0c0e;border-color:var(--ok)}.v.open{background:var(--acc);color:#0b0c0e;border-color:var(--acc)}
code{font:11.5px var(--mono);color:var(--ink2);overflow-wrap:anywhere}tr.d td{background:var(--panel);font-size:12px}
tr.d pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11.5px var(--mono);margin:4px 0;color:var(--ink2);max-height:260px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px}
.reply{display:flex;gap:6px;margin-top:6px}.reply textarea{flex:1;min-height:32px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:12px system-ui;padding:4px 6px}.reply button{background:var(--acc);color:#0b0c0e;border:0;border-radius:6px;font-weight:700;padding:0 12px;cursor:pointer}
.err{color:var(--warn)}.jobs{color:var(--ink3)}
</style><script src="/app-links.js"></script>
</head><body>
<header><a href="/">&larr; AgentGlim</a><h1>Alerts</h1><span class="meta" id="cfg"></span></header>
<main>
<div class="tiles" id="tiles"></div>
<div class="tabs"><button class="tab on" data-tab="alerts">Alerts</button><button class="tab" data-tab="attempts">Attempt history</button></div>
<div class="bar" id="bar"></div>
<div class="tw" id="alertsPane"><table><thead><tr><th>last seen</th><th>count</th><th>state</th><th>kind</th><th>plan</th><th>cause</th><th>first seen</th><th>jobs</th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="tw" id="attemptsPane" hidden><table><thead><tr><th>when</th><th>key</th><th>job</th><th>rc</th><th>cause</th><th>alert</th></tr></thead><tbody id="tb2"></tbody></table></div>
<p class="meta">Reads <code id="src"></code> and the harness digests. One reply closes one digest (through chat-write.mjs). Refreshes every 30 s. Harness rules: HARNESS.md "Alert digest".</p>
</main>
<script>
const $=(i)=>document.getElementById(i), esc=(s)=>String(s??'').replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=(t)=>{if(!t)return '-';const s=(Date.now()-Date.parse(t))/1e3;return s<90?`${s|0}s`:s<5400?`${s/60|0}m`:s<172800?`${s/3600|0}h`:`${s/86400|0}d`};
const when=(t)=>t?new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
let D={groups:[],stats:{}},tab='alerts',F='all',open=null,busy=false;
const FILTERS={all:()=>1,urgent:(g)=>g.urgent,open:(g)=>g.open,answered:(g)=>g.answered&&!g.open};
const stateChip=(g)=>g.open?'<span class="v open">waiting</span>':g.answered?`<span class="v ok">answered</span>`:'<span class="v">-</span>';
function render(){
  const G=D.groups||[],S=D.stats||{};
  $('cfg').textContent=`${S.alerts||0} alerts in ${S.groups||0} groups · ${S.urgent||0} urgent · ${S.open||0} waiting for a reply · window ${D.days||7} days`;
  $('src').textContent=D.file||'';
  $('tiles').innerHTML=[[S.alerts,'alerts'],[S.groups,'groups'],[S.urgent,'urgent'],[S.open,'waiting'],[S.answered,'answered']].map(([v,l])=>`<div class="tile"><b>${v||0}</b><span>${l}</span></div>`).join('');
  $('bar').innerHTML=Object.keys(FILTERS).map((k)=>`<button class="chip${F===k?' on':''}" data-f="${k}">${k} (${G.filter(FILTERS[k]).length})</button>`).join('');
  const rows=G.filter(FILTERS[F]);
  $('tb').innerHTML=rows.map((g)=>{
    const k=g.key;
    let h=`<tr class="r" data-k="${esc(k)}"><td title="${esc(g.last||'')}">${ago(g.last)} ago</td><td><b>${g.count}</b>${g.digestCount?` <span class="meta">(${g.digestCount} in digest)</span>`:''}</td>`
      +`<td>${stateChip(g)}${g.urgent?' <span class="v crit">urgent</span>':''}</td><td>${esc(g.from)} / ${esc(g.kind)}</td><td>${esc(g.plan)}</td><td>${esc(g.cause)}${g.label?`<div class="meta">${esc(g.label)}</div>`:''}</td>`
      +`<td title="${esc(g.first||'')}">${when(g.first)}</td><td class="jobs">${g.jobs.length} job${g.jobs.length===1?'':'s'}</td></tr>`;
    if(open===k){
      const jobs=g.jobs.slice(0,40).map(esc).join(', ');
      const attempts=g.attempts.slice(0,8).map((a)=>`${when(a.at)} ${a.job?esc(a.job):''} ${a.rc!=null?`rc ${esc(a.rc)}`:''} ${esc(String(a.text).slice(0,180))}`).join('\n');
      h+=`<tr class="d"><td colspan="8">`
        +`<div><b>key</b> <code>${esc(k)}</code> · <b>first</b> ${when(g.first)} · <b>last</b> ${when(g.last)}${g.answeredAt?` · <b>answered</b> ${when(g.answeredAt)}`:''}</div>`
        +`<div class="jobs"><b>jobs:</b> ${jobs||'(none)'}</div>`
        +`<pre>${esc(g.digestText||'No digest for this key yet (older than the digest build, or already closed).')}</pre>`
        +`<pre>${esc(attempts)}\n\n— every one of these is in ${esc(D.file||'_run/alerts/alerts.ndjson')} (Attempt history tab)</pre>`
        +(g.open?`<div class="reply"><textarea placeholder="One reply closes this digest (this plan group)"></textarea><button data-send="${esc(String(g.ms||''))}">Reply</button></div>`:'')
        +`</td></tr>`;
    }
    return h;
  }).join('')||`<tr><td colspan="8" class="meta">No alerts in this window.</td></tr>`;
  const A=[];
  for(const g of G.filter(FILTERS[F])) for(const a of g.attempts.slice(0,50)) A.push({...a,key:g.key,plan:g.plan});
  A.sort((a,b)=>(Date.parse(b.at)||0)-(Date.parse(a.at)||0));
  $('tb2').innerHTML=A.slice(0,500).map((a)=>`<tr><td>${when(a.at)}</td><td><code>${esc(a.key)}</code></td><td>${a.job?esc(a.job):'-'}</td><td>${a.rc==null?'-':esc(a.rc)}</td><td>${esc(a.cause)}</td><td>${esc(String(a.text).slice(0,240))}</td></tr>`).join('')
    ||`<tr><td colspan="6" class="meta">No attempts in this window. (F31's job-status-integrity ledger joins this same per-key list.)</td></tr>`;
  $('alertsPane').hidden=tab!=='alerts'; $('attemptsPane').hidden=tab!=='attempts';
}
document.addEventListener('click',async(ev)=>{
  const f=ev.target.closest('[data-f]'); if(f){F=f.dataset.f;return render()}
  const t=ev.target.closest('[data-tab]'); if(t){tab=t.dataset.tab;document.querySelectorAll('.tab').forEach((x)=>x.classList.toggle('on',x.dataset.tab===tab));return render()}
  const b=ev.target.closest('[data-send]'); if(b){ if(busy) return; const box=b.parentElement.querySelector('textarea'), text=box.value.trim();
    if(!text) { box.focus(); return; } busy=true; b.textContent='...';
    try{ const r=await fetch('/api/alerts/reply',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ms:b.dataset.send,text})});
      const j=await r.json(); if(!r.ok||!j.ok){ b.textContent='Reply failed'; b.title=j.error||r.status; setTimeout(()=>{b.textContent='Reply';b.title=''},4000); } else { box.value=''; b.textContent='Sent'; await load(); } }
    finally{ busy=false; }
    return; }
  const r=ev.target.closest('tr.r'); if(r){open=open===r.dataset.k?null:r.dataset.k;render()}
});
const load=async()=>{try{const r=await fetch('/api/alerts');if(!r.ok)throw new Error(r.status);D=await r.json();render()}catch(e){$('tb').innerHTML=`<tr><td colspan="8" class="err">Could not load /api/alerts (${esc(e.message)}).</td></tr>`}};
load();setInterval(()=>{if(!document.hidden)load()},30000);
</script></body></html>
